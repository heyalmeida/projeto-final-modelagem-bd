<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8"><title>EduGestor — route sweep</title>
<style>
  body { font-family: Segoe UI, Arial, sans-serif; margin: 24px; background: #f4f1e9; color: #152238; }
  #frame { width: 1280px; height: 900px; border: 1px solid #ccc; background: #fff; }
  pre { white-space: pre-wrap; background: #fff; border: 1px solid #ddd; padding: 14px; border-radius: 8px; }
  .pass { color: #15803d; } .fail { color: #b91c1c; font-weight: 700; }
</style></head>
<body>
<h1>EduGestor — varredura de rotas e responsividade</h1>
<iframe id="frame"></iframe>
<pre id="out">executando...</pre>
<script>
const frame = document.getElementById('frame');
const out = document.getElementById('out');
const results = [];
const sleep = ms => new Promise(r => setTimeout(r, ms));
function record(name, ok, detail) { results.push({ name, ok, detail: detail || '' }); }
function waitFor(fn, timeout = 5000) {
  return new Promise((resolve, reject) => {
    const start = Date.now();
    (function poll() {
      try { const v = fn(); if (v) return resolve(v); } catch (e) {}
      if (Date.now() - start > timeout) return reject(new Error('timeout'));
      setTimeout(poll, 50);
    })();
  });
}
const text = el => (el ? el.textContent : '').replace(/\s+/g, ' ').trim();
const users = ['u-ana', 'u-bruno', 'u-carlos', 'u-maria', 'u-joao', 'u-lucia', 'u-helena', 'u-root'];
const errors = [];

localStorage.clear();
let ran = false;
frame.addEventListener('load', async () => {
  if (ran) return;
  ran = true;
  const win = frame.contentWindow;
  const doc = frame.contentDocument;
  win.addEventListener('error', e => errors.push('error: ' + e.message));
  win.addEventListener('unhandledrejection', e => errors.push('rejection: ' + (e.reason && e.reason.message || e.reason)));
  try {
    await waitFor(() => doc.querySelector('.login-page'));
    for (const userId of users) {
      const loginBtn = doc.querySelector(`[data-action="login"][data-user="${userId}"]`);
      if (!loginBtn) { record('login ' + userId, false, 'botão ausente'); continue; }
      loginBtn.click();
      await waitFor(() => doc.querySelector('#view h1'));
      const dash = text(doc.querySelector('#view'));
      const expectedAbsent = {
        'u-carlos': ['Financeiro em destaque'],
        'u-maria': ['Avaliações em destaque', 'Avaliações abertas'],
        'u-joao': ['Avaliações em destaque', 'Avaliações abertas', 'Frequência'],
        'u-lucia': ['Avaliações em destaque', 'Avaliações abertas', 'Resumo financeiro', 'Frequência'],
        'u-helena': ['Resumo financeiro', 'Em aberto']
      }[userId] || [];
      const leaked = expectedAbsent.filter(term => dash.includes(term));
      record('dashboard isolado ' + userId, leaked.length === 0, leaked.join(' | '));
      const links = [...doc.querySelectorAll('.nav-item')].map(a => a.getAttribute('href')).filter(Boolean);
      let routeFail = '';
      for (const href of links) {
        win.location.hash = href;
        await sleep(160);
        const h1 = doc.querySelector('#view h1');
        if (!h1 || !text(h1)) { routeFail = href; break; }
        if (doc.querySelector('#view').innerHTML.length < 50) { routeFail = href + ' (vazio)'; break; }
      }
      record('rotas de ' + userId, !routeFail, routeFail ? 'falhou em ' + routeFail : links.length + ' rota(s)');
      const blocked = [...doc.querySelectorAll('.nav-item')].map(a => a.getAttribute('href'));
      const all = ['#/avaliacoes', '#/financeiro', '#/presenca', '#/agenda', '#/biblioteca'];
      const notAllowed = all.find(h => !blocked.includes(h));
      if (notAllowed) {
        win.location.hash = notAllowed;
        await sleep(180);
        record('bloqueio ' + userId + ' ' + notAllowed, text(doc.querySelector('#view h1')).includes('não está disponível'), text(doc.querySelector('#view h1')));
      }
      doc.querySelector('[data-action="logout"]').click();
      await waitFor(() => doc.querySelector('.login-page'));
    }

    // Responsivo: largura de telefone
    frame.style.width = '390px';
    frame.style.height = '844px';
    await sleep(200);
    const login = doc.querySelector('[data-action="login"][data-user="u-ana"]');
    login.click();
    await waitFor(() => doc.querySelector('#view h1'));
    for (const href of ['#/painel', '#/avaliacoes', '#/financeiro', '#/presenca', '#/agenda', '#/biblioteca']) {
      win.location.hash = href;
      await sleep(180);
      const scrollW = doc.documentElement.scrollWidth;
      const innerW = win.innerWidth;
      record('mobile ' + href, scrollW <= innerW + 1, `${scrollW}px de largura em ${innerW}px`);
    }
    win.localStorage.clear();
    record('sem erros de execução', errors.length === 0, errors.join(' | '));
  } catch (err) {
    record('execução', false, err && err.message ? err.message : String(err));
  }
  const passed = results.filter(r => r.ok).length;
  out.innerHTML = `<strong class="${passed === results.length ? 'pass' : 'fail'}">${passed}/${results.length} verificações passaram</strong>\n` +
    results.map(r => `${r.ok ? 'PASS' : 'FAIL'} · ${r.name}${r.detail ? ' — ' + r.detail : ''}`).join('\n');
  document.title = passed === results.length ? 'ROUTES_OK' : 'ROUTES_FAIL';
});
frame.src = '../index.html?routes=' + Date.now();
</script>
</body></html>
